# RehnumaRent — M1 skeleton stack.
# Postgres+PostGIS for the Bahria plot grid, Redis for OTP/notification jobs (used from M2),
# and the FastAPI app. `docker compose up` brings the API up; run the seed once afterwards:
#   docker compose run --rm api python -m app.seed
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rehnuma
      POSTGRES_PASSWORD: rehnuma
      POSTGRES_DB: rehnuma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehnuma -d rehnuma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rehnuma
      MINIO_ROOT_PASSWORD: rehnuma-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://rehnuma:rehnuma@db:5432/rehnuma
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: rehnuma
      MINIO_SECRET_KEY: rehnuma-secret
      MINIO_BUCKET: agreements
      # Auto-seed the Bahria grid on startup if empty (convenient for the demo).
      AUTO_SEED: "true"
      # Pass secrets/keys through from the host env or a root .env (default empty).
      # Drop GROQ_API_KEY into .env and Rehnuma uses the real model — keys stay server-side.
      ENV: ${ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      HASH_PEPPER: ${HASH_PEPPER:-dev-insecure-pepper-change-me}
      PHONE_ENCRYPTION_SECRET: ${PHONE_ENCRYPTION_SECRET:-dev-insecure-phone-key-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      # Apify listing import (set these in .env, then: docker compose run --rm api python -m app.jobs.apify_import)
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-}
      APIFY_RUN_INPUT_JSON: ${APIFY_RUN_INPUT_JSON:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Next rewrites /api/* -> the FastAPI service (server-side), so the browser is
      # same-origin and no API key is ever exposed.
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
