# Render Blueprint for RehnumaRent. In the Render dashboard: New + → Blueprint → connect the
# repo. Review costs (this is a paid, multi-service stack). See DEPLOY-RENDER.md for full steps.
#
# Object storage (agreement/listing PDFs + photos) uses an S3-compatible service. The simplest
# is Cloudflare R2 (free tier) — set the MINIO_* vars below in the dashboard (they're marked
# sync:false). Local dev still uses the bundled MinIO via docker-compose.

databases:
  - name: rehnuma-db
    databaseName: rehnuma
    user: rehnuma
    plan: basic-256mb            # PostGIS needs a paid plan; see DEPLOY-RENDER.md
    postgresMajorVersion: "16"

services:
  # --- Redis (OTP, rate limits, comps cache) ---
  - type: redis
    name: rehnuma-redis
    plan: free
    ipAllowList: []              # internal only
    maxmemoryPolicy: noeviction

  # --- FastAPI backend ---
  - type: web
    name: rehnuma-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: AUTO_SEED
        value: "true"            # seed the Bahria grid on first boot
      - key: DATABASE_URL
        fromDatabase:
          name: rehnuma-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rehnuma-redis
          property: connectionString
      # Secrets — Render generates stable random values.
      - key: SECRET_KEY
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
      - key: PHONE_ENCRYPTION_SECRET
        generateValue: true
      # Object storage (S3-compatible, e.g. Cloudflare R2) — set in the dashboard.
      - key: MINIO_ENDPOINT
        sync: false              # e.g. <account>.r2.cloudflarestorage.com
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: rehnuma
      - key: MINIO_SECURE
        value: "true"            # R2/S3 use TLS
      # LLM + scraping (optional) — set in the dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ACTOR_ID
        sync: false
      - key: APIFY_RUN_INPUT_JSON
        sync: false

  # --- Next.js frontend ---
  - type: web
    name: rehnuma-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: starter
    envVars:
      # The runtime proxy forwards /api/* here (route handler reads this at request time).
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: rehnuma-api
          property: host         # the api's onrender hostname; proxy prepends https://
