# Render Blueprint for the RehnumaRent BACKEND (FastAPI only).
#
# Deliberately NO Render database and NO Render Redis: a free Render account gets only one
# free Postgres, so a second one forces a paid plan. Postgres comes from Neon and Redis from
# Upstash instead — both have permanent free tiers that need no card, and Neon does not expire
# after 90 days the way Render's free database does.
#
# The frontend is NOT here — it runs on Cloudflare Workers (see DEPLOY-CLOUDFLARE.md) and
# proxies /api/* to this service.
#
# In the Render dashboard: New + → Blueprint → connect the repo → Apply, then paste
# DATABASE_URL and REDIS_URL when prompted (they are marked sync:false).
#
# Free-plan caveat: the service sleeps after 15 min idle and cold-starts in ~30-60s. There is
# also no persistent disk, so uploaded listing photos are lost on redeploy — agreement PDFs are
# fine, they regenerate from the deal's locked terms. Both are fixable; see the guide.

services:
  - type: web
    name: rehnumarent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: AUTO_SEED
        value: "true"            # seed the Bahria grid on first boot
      # --- Data services (paste these in the dashboard) ---
      # Neon connection string. libpq-style sslmode/channel_binding params are fine — the app
      # rewrites them for asyncpg (app/dburl.py).
      - key: DATABASE_URL
        sync: false
      # Upstash Redis URL, rediss://default:<password>@<host>:6379
      - key: REDIS_URL
        sync: false
      # --- Secrets — Render generates stable random values ---
      - key: SECRET_KEY
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
      - key: PHONE_ENCRYPTION_SECRET
        generateValue: true
      # --- Optional ---
      # Without GROQ_API_KEY, Rehnuma still replies but with its safe canned advisory rather
      # than live LLM answers.
      - key: GROQ_API_KEY
        sync: false
      # Object storage is optional: with no MINIO_ACCESS_KEY the app writes to the local
      # filesystem (STORAGE_DIR). Add Cloudflare R2 credentials to make uploads durable —
      # MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY / MINIO_BUCKET / MINIO_SECURE.
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ACTOR_ID
        sync: false
      - key: APIFY_RUN_INPUT_JSON
        sync: false
