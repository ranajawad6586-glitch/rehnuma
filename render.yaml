# Render Blueprint for the RehnumaRent BACKEND (FastAPI + Postgres + Redis), all on free plans.
# The frontend is NOT here — it runs on Cloudflare Workers (see DEPLOY-CLOUDFLARE.md), which
# proxies /api/* to the `rehnumarent-api` service below.
#
# In the Render dashboard: New + → Blueprint → connect the repo → Apply.
#
# Free-plan caveats (both fine for a demo, both fixable — see DEPLOY-CLOUDFLARE.md):
#  - The web service sleeps after 15 min idle; the next request cold-starts in ~30-60s.
#  - Free Postgres expires 90 days after creation, and free services have no persistent disk,
#    so uploaded listing photos are lost on redeploy. Agreement PDFs regenerate from locked terms.

databases:
  - name: rehnumarent-db
    databaseName: rehnumarent
    user: rehnumarent
    plan: free                   # plain Postgres — no PostGIS needed
    postgresMajorVersion: "16"

services:
  # --- Redis (OTP, rate limits, comps cache) ---
  - type: redis
    name: rehnumarent-redis
    plan: free
    ipAllowList: []              # internal only
    maxmemoryPolicy: noeviction

  # --- FastAPI backend ---
  - type: web
    name: rehnumarent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: AUTO_SEED
        value: "true"            # seed the Bahria grid on first boot
      - key: DATABASE_URL
        fromDatabase:
          name: rehnumarent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rehnumarent-redis
          property: connectionString
      # Secrets — Render generates stable random values.
      - key: SECRET_KEY
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
      - key: PHONE_ENCRYPTION_SECRET
        generateValue: true
      # CORS: the browser talks to the Cloudflare Worker, which proxies here server-side, so no
      # cross-origin request is made. Nothing to configure.
      #
      # Object storage is OPTIONAL: with no MINIO_ACCESS_KEY the app writes to the local
      # filesystem (STORAGE_DIR). To make uploads durable, add Cloudflare R2 credentials in the
      # dashboard: MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET,
      # MINIO_SECURE=true.
      #
      # LLM + scraping (optional) — set in the dashboard. Without GROQ_API_KEY, Rehnuma returns
      # its safe canned advisory instead of live answers.
      - key: GROQ_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ACTOR_ID
        sync: false
      - key: APIFY_RUN_INPUT_JSON
        sync: false
